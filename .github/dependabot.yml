version: 2
updates:
  # Frontend dependencies
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5

  # Rust / Tauri shell
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5

  # E2E tooling
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
