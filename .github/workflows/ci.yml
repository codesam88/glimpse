name: CI

# Trixie-first packaging pipeline.
# V1 targets Debian Trixie (13) only; Ubuntu 24.04 and generic rebuilds are
# explicitly deferred to post-V1 (a Trixie glibc floor will NOT run on 24.04).

'on':
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build + offline check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node 22
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Record dist size
        run: |
          echo "### web/dist size" >> "$GITHUB_STEP_SUMMARY"
          du -sh web/dist | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Top files by size:" >> "$GITHUB_STEP_SUMMARY"
          find web/dist -type f -printf '%s %p\n' | sort -rn | head -20 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Offline reference check (non-blocking)
        run: |
          if grep -RInE 'https?://' web/dist --include='*.js' --include='*.html' --include='*.css' | grep -v 'data:' | head -20; then
            echo "::warning::Built assets contain http(s):// references; review for runtime network access."
          else
            echo "No http(s):// references found in built assets."
          fi

      - name: npm audit (non-blocking)
        working-directory: web
        continue-on-error: true
        run: npm audit --audit-level=moderate || true

      - name: Upload web dist
        uses: actions/upload-artifact@v4.6.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  trixie-deb:
    name: Trixie deb
    uses: ./.github/workflows/build-trixie.yml
    with:
      bundle: deb
    permissions:
      contents: read

  trixie-appimage:
    name: Trixie appimage
    # The ~100MB AppImage only builds on tags/manual; .deb builds every push.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-trixie.yml
    with:
      bundle: appimage
    permissions:
      contents: read
