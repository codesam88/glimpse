name: CI

# Trixie-first packaging pipeline.
# V1 targets Debian Trixie (13) only; Ubuntu 24.04 and generic rebuilds are
# explicitly deferred to post-V1 (a Trixie glibc floor will NOT run on 24.04).

'on':
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web build + offline check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Test web
        working-directory: web
        run: npm test

      - name: Record dist size
        run: |
          echo "### web/dist size" >> "$GITHUB_STEP_SUMMARY"
          du -sh web/dist | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Top files by size:" >> "$GITHUB_STEP_SUMMARY"
          find web/dist -type f -printf '%s %p\n' | sort -rn | head -20 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Offline reference check (non-blocking)
        run: |
          if grep -RInE 'https?://' web/dist --include='*.js' --include='*.html' --include='*.css' | grep -v 'data:' | head -20; then
            echo "::warning::Built assets contain http(s):// references; review for runtime network access."
          else
            echo "No http(s):// references found in built assets."
          fi

      - name: npm audit (non-blocking)
        working-directory: web
        continue-on-error: true
        run: npm audit --audit-level=moderate || true

      - name: License hygiene (frontend bundle)
        working-directory: web
        run: |
          npx --yes license-checker --production --json > /tmp/licenses.json          # Fail on unknown/unidentified licenses only; permissive + weak-copyleft pass.
          node -e "
            const l = require('/tmp/licenses.json');
            const allow = /^(MIT|ISC|BSD-[23]-Clause|Apache-2\.0|0BSD|CC0-1\.0|Unlicense|MPL-2\.0|CC-BY-[0-9.]+|CC-BY-SA-[0-9.]+|Python-2\.0|PSF-2\.0|BlueOak-1\.0\.0|WTFPL|UNLICENSED|\(?MPL-2\.0 OR Apache-2\.0\)?|\(?EPL-2\.0 OR GPL-3\.0-or-later\)?|\(MIT OR [^)]+\))/i;
            const bad = Object.entries(l).filter(([k, v]) => !allow.test(v.licenses || ''));
            for (const [k, v] of bad) console.log('NON-ALLOWED:', k, '=>', v.licenses);
            if (bad.length) { console.error('Unknown/non-allowed licenses found'); process.exit(1); }
          "
          echo "License check passed."

      - name: Upload web dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  trixie-deb:
    name: Trixie deb
    uses: ./.github/workflows/build-deb.yml
    with:
      bundle: deb
      image: debian:trixie-slim
      distro-tag: trixie
    permissions:
      contents: read

  ubuntu24-deb:
    name: Ubuntu 24.04 deb
    # Min-glibc build: runs on Ubuntu 24.04 AND newer dev hosts (26.04+);
    # used for rolling install testing/debugging alongside the Trixie floor.
    uses: ./.github/workflows/build-deb.yml
    with:
      bundle: deb
      image: ubuntu:24.04
      distro-tag: ubuntu24
    permissions:
      contents: read

  trixie-appimage:
    name: Trixie appimage
    # The ~100MB AppImage only builds on tags/manual; .deb builds every push.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-deb.yml
    with:
      bundle: appimage
      image: debian:trixie-slim
      distro-tag: trixie
    permissions:
      contents: read
