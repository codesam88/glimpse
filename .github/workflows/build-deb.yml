name: DEB bundle

# Reusable single-bundle builder (called per distro/bundle from ci.yml).
# Distro floor is set by the container image: binaries run on that distro
# and newer (glibc forward-compat), NOT older.

on:
  workflow_call:
    inputs:
      bundle:
        description: Tauri bundle target (deb or appimage)
        required: true
        type: string
      image:
        description: Container image (sets the distro/glibc floor)
        required: true
        type: string
      distro-tag:
        description: Short distro label for names (e.g. trixie, ubuntu24)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.distro-tag }} ${{ inputs.bundle }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ inputs.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
      ARCH: x86_64
    steps:
      - name: Install base tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget git build-essential pkg-config \
            file xz-utils

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node 22
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
          node --version
          npm --version

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version

      - name: Install Tauri system dependencies
        run: |
          apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            fuse libfuse2 \
            libssl-dev \
            libdbus-1-dev \
            libxdo-dev
          # AppIndicator package name varies by distro release; non-fatal.
          apt-get install -y --no-install-recommends libayatana-appindicator3-dev \
            || apt-get install -y --no-install-recommends libappindicator3-dev \
            || true

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            src-tauri/target
          key: ${{ inputs.distro-tag }}-cargo-${{ inputs.bundle }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ inputs.distro-tag }}-cargo-${{ inputs.bundle }}-
            ${{ inputs.distro-tag }}-cargo-

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ inputs.distro-tag }}-npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ inputs.distro-tag }}-npm-

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: Clean stale bundles (target/ is cache-restored)
        run: rm -rf src-tauri/target/release/bundle

      - name: Tauri build (${{ inputs.bundle }})
        working-directory: src-tauri
        shell: bash
        run: |
          source "$HOME/.cargo/env"
          npx @tauri-apps/cli build --bundles ${{ inputs.bundle }}

      - name: Record bundle artifacts
        run: |
          echo "### ${{ inputs.distro-tag }} ${{ inputs.bundle }} bundles" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -printf '%f %s bytes\n' | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null || true

      - name: cargo deny (licenses + bans + sources, blocking)
        working-directory: src-tauri
        shell: bash
        run: |
          source "$HOME/.cargo/env"
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --locked
          fi
          cargo deny check licenses bans sources

      - name: cargo audit (non-blocking)
        working-directory: src-tauri
        shell: bash
        continue-on-error: true
        run: |
          source "$HOME/.cargo/env"
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked || exit 0
          fi
          cargo audit || true

      - name: Upload bundle (${{ inputs.distro-tag }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glimpse-${{ inputs.distro-tag }}-${{ inputs.bundle }}
          path: ${{ inputs.bundle == 'appimage' && 'src-tauri/target/release/bundle/appimage/*.AppImage' || 'src-tauri/target/release/bundle/deb/*.deb' }}
          if-no-files-found: error
          retention-days: 14
