name: Release

# On version tags: build both Trixie bundles, produce checksums, publish a
# GitHub Release with .deb + .AppImage + sha256sums.txt attached.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deb:
    name: Trixie deb
    uses: ./.github/workflows/build-trixie.yml
    with:
      bundle: deb
    permissions:
      contents: read

  appimage:
    name: Trixie appimage
    uses: ./.github/workflows/build-trixie.yml
    with:
      bundle: appimage
    permissions:
      contents: read

  release:
    name: Publish release
    needs: [deb, appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: glimpse-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum -- ./*.deb ./*.AppImage > sha256sums.txt
          cat sha256sums.txt

      - name: Publish GitHub Release
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Glimpse $TAG" \
            --notes "Trixie (Debian 13) builds. See sha256sums.txt for integrity." \
            --verify-tag 2>/dev/null || gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*.deb ./*.AppImage sha256sums.txt
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*.deb ./*.AppImage sha256sums.txt
