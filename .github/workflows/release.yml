name: Release

# On version tags: build Trixie (floor) + Ubuntu 24.04 (min-glibc) bundles,
# produce checksums, publish a GitHub Release with all artifacts attached.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deb:
    name: Trixie deb
    uses: ./.github/workflows/build-deb.yml
    with:
      bundle: deb
      image: debian:trixie-slim
      distro-tag: trixie
    permissions:
      contents: read

  ubuntu24-deb:
    name: Ubuntu 24.04 deb
    uses: ./.github/workflows/build-deb.yml
    with:
      bundle: deb
      image: ubuntu:24.04
      distro-tag: ubuntu24
    permissions:
      contents: read

  appimage:
    name: Trixie appimage
    uses: ./.github/workflows/build-deb.yml
    with:
      bundle: appimage
      image: debian:trixie-slim
      distro-tag: trixie
    permissions:
      contents: read

  release:
    name: Publish release
    needs: [deb, ubuntu24-deb, appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: glimpse-*

      - name: Rename debs per distro (same filename from both builds)
        shell: bash
        run: |
          mkdir -p out
          ls -la dist/*/
          [ -d dist/glimpse-trixie-deb ] && mv dist/glimpse-trixie-deb/*.deb "out/glimpse-${GITHUB_REF_NAME}-trixie_amd64.deb"
          [ -d dist/glimpse-ubuntu24-deb ] && mv dist/glimpse-ubuntu24-deb/*.deb "out/glimpse-${GITHUB_REF_NAME}-ubuntu24.04_amd64.deb"
          [ -d dist/glimpse-trixie-appimage ] && mv dist/glimpse-trixie-appimage/*.AppImage "out/glimpse-${GITHUB_REF_NAME}-trixie_amd64.AppImage"
          ls -la out/

      - name: Checksums
        working-directory: out
        run: |
          sha256sum -- ./*.deb ./*.AppImage > sha256sums.txt
          cat sha256sums.txt

      - name: Publish GitHub Release
        working-directory: out
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Glimpse $TAG" \
            --notes "Trixie (Debian 13) floor + Ubuntu 24.04 min-glibc build. See sha256sums.txt for integrity." \
            --verify-tag 2>/dev/null || gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*.deb ./*.AppImage sha256sums.txt
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*.deb ./*.AppImage sha256sums.txt
