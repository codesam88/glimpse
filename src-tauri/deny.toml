# cargo-deny configuration — licenses, advisories.
# Run: cargo deny check (CI uses EmbarkStudios/cargo-deny-action, pinned by SHA).

[graph]
all-features = true

[licenses]
version = 2
# Glimpse is MIT. Everything linked must be permissive or weak-copyleft
# (EPL/MPL allowed for unmodified bundled deps).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "EPL-2.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "BSL-1.0",
]
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
